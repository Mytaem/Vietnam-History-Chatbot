# Cấu hình chính - xem PLAN.md Mục 7
llm:
  host: http://localhost:11434          # ghi đè bằng OLLAMA_HOST trong .env
  chat_model: qwen3:4b-instruct
  extract_model: qwen3:4b-instruct
  embed_model: bge-m3
  embed_dim: 1024
  num_ctx: 8192
  temperature: 0.0
  timeout_s: 120
  workers: 2
  max_retries: 2

neo4j:
  uri: bolt://localhost:7687            # ghi đè bằng NEO4J_URI
  user: neo4j
  database: neo4j

paths:
  data_dir: data
  cache_dir: data/cache/llm
  reports_dir: data/reports

scope:
  max_year: 1945
  periods_file: configs/periods.yaml
  backbone_dir: configs/backbone

ingest:
  lang: vi
  expand_hops: 1
  category_depth: 2
  wikidata_batch: 50
  # Wikimedia chặn (403) User-Agent không có thông tin liên hệ: https://w.wiki/4wJS
  user_agent: "hgr-history-graphrag/0.1 (https://github.com/Mytaem/Vietnam-History-Chatbot)"
  max_articles: {mini: 18, core: 280, full: 1000, era: 450, period: 80}
  # P31 cho phép với bài mở rộng (seed luôn được giữ). Chọn theo data/reports/rejected_p31.tsv của bản full:
  # người, trận, chiến tranh, triều đại, cựu quốc gia, sự kiện, nổi loạn, hiệp ước, đảng phái, tác phẩm viết,
  # văn hóa khảo cổ, di chỉ, khu định cư,
  # triều đại Trung Hoa, cựu quốc gia Trung Hoa, tác phẩm văn học, sử liệu phi hư cấu, sách lịch sử, tác phẩm,
  # sông, đèo, thành, xứ bảo hộ, thuộc địa, khu vực, chùa Việt Nam, thành phố cổ, thời kỳ lịch sử,
  # khía cạnh của lịch sử, tổ chức, lực lượng vũ trang, châu, tỉnh thời Pháp thuộc.
  # Cố ý không lấy: quốc gia/thành phố/tỉnh hiện đại, ngôn ngữ, tôn giáo, khái niệm (quá chung, nhiều nhiễu).
  allowed_p31: [Q5, Q178561, Q198, Q164950, Q3024240, Q1190554, Q124734, Q131569, Q7278, Q47461344, Q465299,
                Q839954, Q486972,
                Q12857432, Q50068795, Q7725634, Q10916116, Q30277550, Q386724,
                Q4022, Q133056, Q88291, Q164142, Q133156, Q1414991, Q10748583, Q15661340, Q11514315,
                Q17524420, Q43229, Q772547, Q1070912, Q10831631]
  min_seed_links: 1          # bài mở rộng phải link tới ít nhất N bài seed (lọc bài lạc đề như Tề, Algiers)
  person_min_age_1945: 20    # người sinh sau (1945 - N) khó là nhân vật lịch sử trước 1945

chunk:
  target_tokens: 500
  overlap_sentences: 1
  min_tokens: 80
  drop_post_cutoff: true
  drop_sections: [Tham khảo, Chú thích, Xem thêm, Liên kết ngoài, Đọc thêm, Ghi chú]

extract:
  prompt_version: v1
  gleaning: false
  min_confidence: 0.6
  evidence_ratio: 90
  max_chunks_b: 3
  few_shot_by_era: true

resolve:
  fuzzy_threshold: 92
  event_year_tolerance: 1
  period_blocking: adjacent        # same | adjacent | none

retrieval:
  chunk_k: 20
  hops: 2
  max_degree: p99                  # số cố định hoặc "p99"
  ppr_alpha: 0.85
  ppr_top_n: 25
  top_chunks: 8
  overview_top_chunks: 12
  context_max_tokens: 1200
  rerank: false
  rerank_model: BAAI/bge-reranker-v2-m3
  rrf_k: 60
  evidence_boost: 1.3
  fusion:                          # [vector, graph, path]
    factoid:    [0.5, 0.5, 0.0]
    multihop:   [0.3, 0.7, 0.0]
    temporal:   [0.4, 0.6, 0.0]
    relational: [0.2, 0.4, 0.4]
    comparison: [0.4, 0.6, 0.0]
    overview:   [0.6, 0.4, 0.0]

api:
  host: 127.0.0.1
  port: 8000
